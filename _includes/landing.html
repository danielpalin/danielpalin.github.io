<div class="row justify-content-center align-items-center p-4">
  <div class="col-lg-4 col-md-6 text-center mt-4">

    <!-- Fine Circle Responsive Image -->
    <div id="container" class="my-2">
      <div id="dummy"></div>
      <div id="element">
        <img src="{{ site.author.image }}" alt="{{ site.title }}" class="circle-image wow animated zoomIn" data-wow-delay=".1s">
      </div>
    </div>

    <p class="text-muted wow animated slideInUp" data-wow-delay=".15s">{{ site.description }}</p>

    <div class="mt-3 wow animated fadeIn" data-wow-delay=".2s">
      <a href="https://github.com/{{ site.author.github }}"
         class="social mx-2" target="_blank" rel="noopener"
         style="color:#6c757d" title="GitHub"
         onMouseOver="this.style.color='#333333'" onMouseOut="this.style.color='#6c757d'">
        <i class="fab fa-github fa-2x"></i>
      </a>
      <a href="https://x.com/danielwpalin"
         class="social mx-2" target="_blank" rel="noopener"
         style="color:#6c757d" title="Twitter / X"
         onMouseOver="this.style.color='#1da1f2'" onMouseOut="this.style.color='#6c757d'">
        <i class="fa-brands fa-x-twitter fa-2x"></i>
      </a>
      <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/"
         class="social mx-2" target="_blank" rel="noopener"
         style="color:#6c757d" title="LinkedIn"
         onMouseOver="this.style.color='#007bb5'" onMouseOut="this.style.color='#6c757d'">
        <i class="fab fa-linkedin-in fa-2x"></i>
      </a>
      <a href="mailto:{{ site.author.email }}"
         class="social mx-2"
         style="color:#6c757d" title="Email"
         onMouseOver="this.style.color='#db4437'" onMouseOut="this.style.color='#6c757d'">
        <i class="fas fa-envelope fa-2x"></i>
      </a>
    </div>
    <div class="mt-2 wow animated fadeIn" data-wow-delay=".25s">
      <a href="/assets/pdf/daniel_palin_resume_august.pdf"
         class="text-muted" target="_blank" rel="noopener"
         style="font-size:1.1rem;"
         onMouseOver="this.style.color='#e74c3c'" onMouseOut="this.style.color=''">
        Resume
      </a>
    </div>

  </div>
</div>
