<div class="row m-3 mt-4">

  {% for item in site.data.research %}
  <div class="col-md-6 col-lg-4 mb-4 d-flex">
    <div class="wow animated fadeIn w-100" data-wow-delay=".15s">
      <a href="{{ item.url }}" class="project card text-themed h-100" target="_blank" rel="noopener">
        <img class="card-img-top" src="{{ item.image }}" alt="{{ item.title }}" loading="lazy" style="aspect-ratio: 16/9; object-fit: cover;" />
        <div class="card-body">
          <h5 class="card-title">{{ item.title }}</h5>
          <p class="card-text">{{ item.description }}</p>
          <p class="card-text">
            <span class="badge badge-pill text-secondary border border-secondary ml-1">{{ item.date }}</span>
            <span class="badge badge-pill text-primary border border-primary ml-1">Paper</span>
          </p>
        </div>
      </a>
    </div>
  </div>
  {% endfor %}

</div>
